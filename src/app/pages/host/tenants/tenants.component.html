<div class="card">
    <p-toolbar class="mb-6">
        <ng-template #start>
            <h3>Manage Tenants</h3>
        </ng-template>

        <ng-template #end>
            <p-button label="Create Tenant" icon="pi pi-plus" class="mr-2" (onClick)="openCreateDialog()" />
        </ng-template>
    </p-toolbar>

    <NG-Table [value]="tenantsData" [columns]="columns" [actions]="actions" [totalCount]="totalCount" [loading]="loading" [rows]="10" [globalSearchFields]="['slug', 'name']" [lazyLoadFn]="getAllTenants.bind(this)">
        <!-- Custom Template for Status Column -->
        <ng-template let-row pTemplate="status">
            <p-tag [severity]="row.status === 'active' ? 'success' : 'danger'" [value]="row.status | uppercase"></p-tag>
        </ng-template>

        <!-- Custom Template for Date Column -->
        <ng-template let-row pTemplate="createdAt">
            {{ row.createdAt | date: 'short' }}
        </ng-template>
    </NG-Table>

    <p-dialog [(visible)]="showCreateEditDialog" [style]="{ minWidth: '50vw' }" [header]="editMode ? 'Update Tenant' : 'Create Tenant'" [modal]="true" (onHide)="hideDialog()">
        <form [formGroup]="form" class="p-2 flex flex-col space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6">
                <!-- Tenant Name -->
                <div class="w-full">
                    <NG-Input [label]="'Tenant Name'" [formControlName]="'tenantName'" [id]="'tenantName'" [mark]="true" class="w-full"></NG-Input>
                    <div *ngIf="isFieldInvalid('tenantName')" class="mt-1 text-sm text-[var(--text-danger-color)]">
                        <span *ngFor="let error of getFieldErrors('tenantName')" class="block">{{ error }}</span>
                    </div>
                </div>

                <!-- Tenant Slug -->
                <div class="w-full">
                    <NG-Input [label]="'Tenant Slug'" [formControlName]="'tenantSlug'" [id]="'tenantSlug'" [mark]="true" class="w-full"></NG-Input>
                    <div *ngIf="isFieldInvalid('tenantSlug')" class="mt-1 text-sm text-[var(--text-danger-color)]">
                        <span *ngFor="let error of getFieldErrors('tenantSlug')" class="block">{{ error }}</span>
                    </div>
                </div>

                <!-- Email -->
                <div class="w-full">
                    <NG-Input [label]="'Email'" [type]="'text'" [formControlName]="'email'" [id]="'email'" [mark]="true" class="w-full"></NG-Input>
                    <div *ngIf="isFieldInvalid('email')" class="mt-1 text-sm text-[var(--text-danger-color)]">
                        <span *ngFor="let error of getFieldErrors('email')" class="block">{{ error }}</span>
                    </div>
                </div>

                <!-- First Name -->
                <div class="w-full">
                    <NG-Input [label]="'First Name'" [formControlName]="'firstName'" [id]="'firstName'" [mark]="true" class="w-full"></NG-Input>
                    <div *ngIf="isFieldInvalid('firstName')" class="mt-1 text-sm text-[var(--text-danger-color)]">
                        <span *ngFor="let error of getFieldErrors('firstName')" class="block">{{ error }}</span>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="w-full">
                    <NG-Input [label]="'Last Name'" [formControlName]="'lastName'" [id]="'lastName'" [mark]="true" class="w-full"></NG-Input>
                    <div *ngIf="isFieldInvalid('lastName')" class="mt-1 text-sm text-[var(--text-danger-color)]">
                        <span *ngFor="let error of getFieldErrors('lastName')" class="block">{{ error }}</span>
                    </div>
                </div>

                <!-- Phone -->
                <div class="w-full">
                    <NG-Input [label]="'Phone'" [formControlName]="'phone'" [id]="'phone'" [mark]="true" class="w-full"></NG-Input>
                    <div *ngIf="isFieldInvalid('phone')" class="mt-1 text-sm text-[var(--text-danger-color)]">
                        <span *ngFor="let error of getFieldErrors('phone')" class="block">{{ error }}</span>
                    </div>
                </div>

                @if (!editMode) {
                    <!-- Password (only for creation) -->
                    <div class="w-full">
                        <NG-Input [label]="'Password'" [type]="'password'" [formControlName]="'password'" [id]="'password'" [mark]="true" class="w-full"></NG-Input>
                        <div *ngIf="isFieldInvalid('password')" class="mt-1 text-sm text-[var(--text-danger-color)]">
                            <span *ngFor="let error of getFieldErrors('password')" class="block">{{ error }}</span>
                        </div>
                    </div>
                }

                <!-- Status -->
                <div class="w-full">
                    <NG-Select
                        [label]="'Status'"
                        [formControlName]="'status'"
                        [options]="[
                            { label: 'Active', value: 'active' },
                            { label: 'Inactive', value: 'inactive' }
                        ]"
                        [id]="'status'"
                        class="w-full"
                    ></NG-Select>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-4">
                <p-button label="Cancel" severity="secondary" (onClick)="hideDialog()" />
                <p-button [label]="editMode ? 'Update' : 'Create'" (onClick)="saveTenant()" [disabled]="!form.valid" />
            </div>
        </form>
    </p-dialog>
</div>
