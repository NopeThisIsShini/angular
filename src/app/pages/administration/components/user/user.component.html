<div class="card">
    <!-- Toolbar with Create Button -->
    <p-toolbar class="mb-6">
        <ng-template #start>
            <h3>Manage Users</h3>
        </ng-template>
        <ng-template #end>
            <p-button label="Add New User" *appHasPermission="'Administration.Users.Create'" icon="pi pi-plus"
                class="mr-2 btn-gradient" (onClick)="triggerEditUser(null, false)" />
        </ng-template>
    </p-toolbar>

    <!-- Main Table -->

    <NG-Table [value]="users()" [columns]="columns" [actions]="actions" [totalCount]="totalCount()" [loading]="loading()"
        [rows]="10" [globalSearchFields]="['fullName', 'emailAddress', 'phoneNumber', 'isActive']"
        [lazyLoadFn]="getallusers.bind(this)">
    </NG-Table>
</div>
<ng-template #isActiveTemplate let-row>
    <p-tag [value]="row.status ? 'Active' : 'Inactive'" [severity]="getSeverity(row.status ? 'active' : 'inactive')" />
</ng-template>
<NG-Dialog 
    [(visible)]="showCreateEditUserDialog" 
    [header]="isEditMode() ? 'Update User' : 'Create User'"
    width="50rem"
    [breakpoints]="{ '1300px': '60vw', '960px': '75vw', '575px': '95vw' }"
    [loading]="isSaving()"
    [footerConfirmLabel]="isEditMode() ? 'Update' : 'Create'"
    severity="primary"
    (onConfirm)="createEditUser(isEditMode())"
    (onCancel)="closeDialog()"
    (onHide)="closeDialog()">
    
    <form [formGroup]="form" (ngSubmit)="createEditUser(isEditMode())">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-2">
            <!-- Loop through form fields -->
            <div *ngFor="let field of formFields" class="w-full">
                <NG-Input *ngIf="field.key !== 'roleIds'" class="w-full" containerClass="w-full" inputClass="w-full"
                    [label]="field.label" [formControlName]="field.key" [type]="field.type" [id]="field.key"
                    [mark]="true"></NG-Input>
                
                <!-- Role Single Select -->
                <NG-Select *ngIf="field.key === 'roleIds'" id="roleIds" formControlName="roleIds" [options]="rolesList()"
                    optionLabel="name" optionValue="id" label="Role" containerClass="w-full shadow-none"
                    selectClass="w-full" [mark]="true"></NG-Select>

                <!-- Error Messages -->
                <div *ngIf="isFieldInvalid(field.key)" class="mt-1 text-sm text-[var(--text-danger-color)]">
                    <span *ngFor="let error of getFieldErrors(field.key)" class="block">
                        {{ error }}
                    </span>
                </div>
            </div>
        </div>
    </form>
</NG-Dialog>
