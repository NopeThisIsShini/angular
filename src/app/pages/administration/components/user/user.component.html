<div class="card">
    <!-- OU Scoping Info Banner -->
    <div *ngIf="currentUserScope" class="mb-4 p-3 rounded-lg bg-gradient-to-r from-primary/10 to-primary/5 border border-primary/20">
        <div class="flex items-center gap-3">
            <i class="pi pi-sitemap text-primary text-xl"></i>
            <div>
                <span class="text-sm text-[var(--text-color-secondary)]">Logged in as:</span>
                <span class="font-semibold ml-2">{{ currentUserScope.userName }}</span>
                <span class="mx-2">·</span>
                <span class="text-sm">
                    <span *ngIf="currentUserScope.organizationUnitPath" class="text-primary font-mono bg-primary/10 px-2 py-0.5 rounded">
                        {{ currentUserScope.organizationUnitName }} ({{ currentUserScope.organizationUnitPath }})
                    </span>
                    <span *ngIf="!currentUserScope.organizationUnitPath" class="text-green-600 font-semibold">
                        🌐 Host Admin - No OU Restrictions
                    </span>
                </span>
            </div>
        </div>
    </div>

    <!-- Toolbar with Create Button -->
    <p-toolbar class="mb-6">
        <ng-template #start> 
            <h3>Manage Users</h3>
            <span class="ml-4 text-sm text-[var(--text-color-secondary)]">({{ users.length }} users in scope)</span>
        </ng-template>
        <ng-template #end>
            <p-button label="Add New User" icon="pi pi-plus" class="mr-2" (onClick)="triggerEditUser(null, false)" />
        </ng-template>
    </p-toolbar>

    <!-- Main Table -->

    <NG-Table
        [value]="users"
        [columns]="columns"
        [actions]="actions"
        [totalCount]="totalCount"
        [loading]="loading"
        [rows]="10"
        [globalSearchFields]="['fullName', 'emailAddress', 'phoneNumber', 'isActive', 'organizationUnitName']"
        [lazyLoadFn]="getallusers.bind(this)"
    >
    </NG-Table>
</div>
<ng-template #isActiveTemplate let-row>
    <p-tag [value]="row.isActive === true ? 'Active' : 'Inactive'" [severity]="getSeverity(row.isActive)" />
</ng-template>
<p-dialog
    (onHide)="closeDialog()"
    header="{{ isEditMode ? 'Update User' : 'Create User' }}"
    [(visible)]="showCreateEditUserDialog"
    [breakpoints]="{ '1300px': '60vw', '960px': '60vw' }"
    [style]="{ width: '50vw' }"
    [modal]="true"
    [draggable]="false"
    (onHide)="closeDialog()"
    [resizable]="false"
>
    <form [formGroup]="form" (ngSubmit)="createEditUser(isEditMode)">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-2">
            <!-- Loop through form fields -->
            <div *ngFor="let field of formFields" class="w-full">
                <NG-Input *ngIf="field.key !== 'roleNames'" class="w-full" containerClass="w-full" inputClass="w-full" [label]="field.label" [formControlName]="field.key" [type]="field.type" [id]="field.key" [mark]="true"></NG-Input>

                <!-- Role Single Select -->
                <NG-Select
                    *ngIf="field.key === 'roleNames'"
                    id="roleNames"
                    formControlName="roleNames"
                    [options]="rolesList"
                    optionLabel="displayName"
                    optionValue="name"
                    label="Role"
                    containerClass="w-full shadow-none"
                    selectClass="w-full"
                    [mark]="true"
                ></NG-Select>

                <!-- OU Select -->
                <NG-Select
                    *ngIf="field.key === 'organizationUnitId'"
                    id="organizationUnitId"
                    formControlName="organizationUnitId"
                    [options]="organizationUnits"
                    optionLabel="displayName"
                    optionValue="id"
                    label="Organization Unit"
                    containerClass="w-full shadow-none"
                    selectClass="w-full"
                    [mark]="false"
                ></NG-Select>


                <!-- Error Messages -->
                <div *ngIf="isFieldInvalid(field.key)" class="mt-1">
                    <span *ngFor="let error of getFieldErrors(field.key)" class="block text-sm text-red-400">
                        {{ error }}
                    </span>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="w-full h-px bg-gray-200 my-6"></div>
        <div class="flex justify-end gap-3">
            <p-button label="Cancel" severity="secondary" (click)="closeDialog()"></p-button>
            <p-button [label]="isEditMode ? 'Update' : 'Create'" type="submit"></p-button>
        </div>
    </form>
</p-dialog>
