<div class="border rounded-lg p-4">
    <p-tree 
        [value]="treeData()" 
        [selectionMode]="selectionMode()" 
        [selection]="selection()" 
        (selectionChange)="onSelectionUpdate($event)"
        (onNodeSelect)="onNodeSelect($event)" 
        (onNodeUnselect)="onNodeUnselect($event)" 
        [styleClass]="treeStyleClass()"> 
    </p-tree>
</div>
